# Memoria para el demonio de Gradle. Compose compila muchas clases y con el
# valor por defecto (512 MB) se queda sin memoria en equipos con poco RAM.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Reusa el proceso de Gradle entre compilaciones: la primera tarda, las
# siguientes son muy rapidas.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
